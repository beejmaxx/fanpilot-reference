<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PAGE_TITLE}} · Fanpilot</title>
  <meta name="description" content="{{DESCRIPTION}}"><meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbfcfe" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#14172e" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="{{CANONICAL}}"><meta property="og:title" content="{{PAGE_TITLE}} · Fanpilot"><meta property="og:description" content="{{DESCRIPTION}}"><meta property="og:type" content="article"><meta property="og:url" content="{{CANONICAL}}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/literata.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/schibsted-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script><script type="module" src="/lru-lab.mjs"></script><script type="module" src="/filesystem-lab.mjs"></script><script type="module" src="/problems.mjs"></script><script type="module" src="/hero-trace.mjs"></script>
</head>
<body data-page="{{PAGE_ID}}">
  <a class="skip-link" href="#reader">Skip to the lesson</a>
  <header class="masthead">
    <a class="brand" href="/" aria-label="Fanpilot home"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="brand-window" x="9" y="7" width="14" height="18" rx="2"></rect><path d="M6 5v22M26 5v22" class="brand-bounds"></path></svg><span>Fanpilot</span></a>
    <nav class="sections" aria-label="Sections">{{SECTIONS}}</nav>
    <div class="search" id="search">
      <label class="sr-only" for="book-search">Search the reference</label>
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg>
      <input id="book-search" type="search" placeholder="Search" autocomplete="off" aria-controls="search-results">
      <kbd aria-hidden="true">/</kbd>
      <div class="search-panel" id="search-panel" hidden>
        <p id="search-status" class="search-status" role="status" aria-live="polite"></p>
        <nav id="search-results" class="search-results" aria-label="Search results"></nav>
      </div>
    </div>
    <button id="menu-button" class="menu-button" aria-expanded="false" aria-controls="sidebar" type="button">Contents</button>
  </header>
  <button class="scrim" id="scrim" aria-label="Close navigation" tabindex="-1" hidden></button>
  <div class="frame">
    <aside class="sidebar rail" id="sidebar" aria-label="Contents">
      <nav id="chapter-navigation" class="chapter-navigation" aria-label="Lessons">{{NAVIGATION}}</nav>
      <div class="sidebar-footer"><p>{{SIDEBAR_SUMMARY}}</p><a href="/research/">Research and sources</a><a href="/about/">About and attribution</a><a href="/leetcode-bible-patterns.pdf">PDF edition</a></div>
    </aside>
    <div class="page" id="content-shell">
      <main id="reader" tabindex="-1">
        <noscript><p class="notice">The lessons work without JavaScript. Interactive labs and search require it.</p></noscript>
        {{ARTICLE}}
        <footer class="reader-footer"><span>Fanpilot, working edition. Free and open source.</span><div><a href="https://github.com/beejmaxx/fanpilot-reference">Source and contributing</a><a href="/LICENSE-CONTENT.txt">Text: CC BY-SA 4.0</a><a href="/LICENSE-CODE.txt">Code: MIT</a></div></footer>
      </main>
      <aside class="page-outline" aria-label="On this page"><div id="outline-content"></div></aside>
    </div>
  </div>
  <div id="copy-status" class="copy-status" role="status" aria-live="polite"></div>
  <script id="chapter-data" type="application/json">{{CHAPTER_DATA}}</script>
</body>
</html>
