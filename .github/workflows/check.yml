name: Check the reference
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      - run: npm ci
      - run: rustup default stable
      - run: npm test
      - run: npm run test:patterns
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check pages and interactive lessons
        shell: bash
        run: |
          python3 -m http.server 8765 --directory dist --bind 127.0.0.1 > /tmp/fanpilot-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          npm run test:site
